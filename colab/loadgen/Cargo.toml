[package]
name = "s3-loadgen"
version = "0.1.0"
edition = "2021"
description = "S6-22s: fair_bench's open-loop load client in Rust (colab/fair_bench.py --client=native)"
license = "Proprietary"
publish = false

# Licences of the dependencies (checked 2026-11-14): tokio MIT; hyper MIT; hyper-util MIT; http-body-util MIT;
# bytes MIT; serde_json MIT OR Apache-2.0.
[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "macros", "net"] }
hyper = { version = "1.4", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
